<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVAHAUS Catalog Assistant</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d212b;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-soft: rgba(79, 140, 255, 0.14);
    --ok: #3fbf7f;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  .status {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--panel-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; padding: 0 4px; }
  .refused { border-color: rgba(255, 107, 107, 0.45); }
  .refused .tag { color: var(--bad); font-weight: 600; font-size: 11px; display: block; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 12px; }
  .typing { color: var(--muted); font-size: 13px; padding: 4px 6px; }

  footer {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
  }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .chip {
    font-size: 12px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
    user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .row { display: flex; gap: 8px; max-width: 860px; margin: 0 auto; }
  #input {
    flex: 1;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <div>
    <h1>NOVAHAUS Catalog Assistant</h1>
    <div class="sub">answers from the ingested catalog &mdash; fully local</div>
  </div>
  <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">connecting&hellip;</span></div>
</header>

<div id="log">
  <div class="hint">Ask about products, shipping, returns, or support.</div>
</div>

<footer>
  <div class="suggestions" id="chips"></div>
  <div class="row">
    <input id="input" type="text" placeholder="Type a question about the catalog&hellip;" autocomplete="off">
    <button id="send">Send</button>
  </div>
</footer>

<script>
(function () {
  var log = document.getElementById('log');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var statusDot = document.getElementById('status-dot');
  var statusText = document.getElementById('status-text');

  var SUGGESTIONS = [
    'How long does delivery take in Jabodetabek?',
    'How long is the return window?',
    'What are the support hours?',
    'What is the cheapest product?',
    'Do you ship to Bali?',
    'What materials is the Aurora Light made from?'
  ];

  document.getElementById('chips').innerHTML = SUGGESTIONS.map(function (s) {
    return '<div class="chip" data-q="' + s.replace(/"/g, '&quot;') + '">' + s + '</div>';
  }).join('');

  document.getElementById('chips').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (chip) { input.value = chip.getAttribute('data-q'); ask(); }
  });

  send.addEventListener('click', ask);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') ask(); });

  function addMsg(text, who, meta) {
    var hint = log.querySelector('.hint');
    if (hint) hint.remove();
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + who;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (meta && meta.refused) {
      bubble.classList.add('refused');
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = meta.refused === 'out_of_scope' ? 'OUT OF SCOPE' : 'NO MATCH';
      bubble.appendChild(tag);
    }
    bubble.appendChild(document.createTextNode(text));
    wrap.appendChild(bubble);
    if (meta) {
      var m = document.createElement('div');
      m.className = 'meta';
      var parts = [];
      if (typeof meta.score === 'number') parts.push('score ' + meta.score.toFixed(3));
      if (meta.degraded) parts.push('degraded embeddings');
      if (meta.cached) parts.push('cached');
      if (meta.ms !== undefined) parts.push(meta.ms + ' ms');
      if (meta.source) parts.push('source: ' + meta.source);
      m.textContent = parts.join(' · ');
      wrap.appendChild(m);
    }
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  async function ask() {
    var q = input.value.trim();
    if (!q) return;
    input.value = '';
    send.disabled = true;
    addMsg(q, 'user');
    var typing = addMsg('…', 'bot');
    var t0 = performance.now();
    try {
      var res = await fetch('/catalog/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q })
      });
      var data = await res.json();
      var meta = { ms: Math.round(performance.now() - t0) };
      if (!res.ok) {
        typing.querySelector('.bubble').textContent = 'Error: ' + (data.error || res.status);
        meta.refused = 'error';
      } else {
        typing.querySelector('.bubble').textContent = data.answer || '';
        meta.score = data.score;
        meta.degraded = data.degraded;
        meta.cached = data.cached;
        if (!data.matched) meta.refused = 'out_of_scope';
      }
      typing.classList.remove('refused');
      // rebuild the meta line with final data
      var oldMeta = typing.querySelector('.meta');
      if (oldMeta) oldMeta.remove();
      var m = document.createElement('div');
      m.className = 'meta';
      var parts = [];
      if (typeof meta.score === 'number') parts.push('score ' + meta.score.toFixed(3));
      if (meta.degraded) parts.push('degraded embeddings');
      if (meta.cached) parts.push('cached');
      if (meta.ms !== undefined) parts.push(meta.ms + ' ms');
      m.textContent = parts.join(' · ');
      typing.appendChild(m);
      setStatus(true, res.ok ? 'ready' : null);
    } catch (err) {
      typing.querySelector('.bubble').textContent = 'Could not reach the server.';
      setStatus(false, 'server unreachable');
    }
    send.disabled = false;
    input.focus();
  }

  function setStatus(ok, text) {
    statusDot.className = 'dot ' + (ok ? 'ok' : 'bad');
    statusText.textContent = text || (ok ? 'ready' : 'unreachable');
  }

  fetch('/openapi.json').then(function (r) {
    setStatus(r.ok, r.ok ? 'ready' : 'error');
  }).catch(function () { setStatus(false, 'server unreachable'); });
})();
</script>
</body>
</html>
